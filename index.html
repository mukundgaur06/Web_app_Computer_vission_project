<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Canvas — Fruit Slice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    Full-screen stage: video (raw webcam) + canvas (everything we draw:
    blade, fruits, effects) stacked exactly on top of each other,
    both filling the whole browser window.
  -->
  <div class="stage">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output-canvas"></canvas>

    <!-- HTML overlay for UI text — kept OUTSIDE the canvas so we don't
         have to hand-draw text with ctx.fillText for every frame. -->
    <div class="overlay">
      <h1>Magic Canvas</h1>
      <p id="status">Starting camera...</p>
      <div id="score-board">
        <span id="score">Score: 0</span>
        <span id="high-score">Best: 0</span>
        <span id="level">Speed: x1.00</span>
      </div>
    </div>

  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
